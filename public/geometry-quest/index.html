<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Geometry Quest</title>
<style>
:root{
  --bg:#f3f6ff;--card:#fff;--ink:#1f2a44;--muted:#5f6c8a;--line:#dbe3f5;
  --blue:#3b6df2;--blue-d:#2c54c4;--blue-l:#e8eeff;--orange:#ff8a3d;--green:#2fb36d;--green-l:#e3f7ec;
  --red:#d9534f;--red-l:#fdecea;--amber:#f5a524;--amber-l:#fff6e0;--gold:#f5b301;
  --r:20px;--shadow:0 6px 20px rgba(31,42,68,.08);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 "Avenir Next","Nunito","Trebuchet MS",system-ui,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:820px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .4em}
h1{font-size:2.2rem}h2{font-size:1.6rem}
p{margin:.4em 0}
.small{font-size:.85rem}.muted{color:var(--muted)}.center{text-align:center}.gold{color:var(--gold);letter-spacing:2px}
.big{font-size:3.4rem;line-height:1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin:14px 0}
.lead{font-size:1.15rem;color:#33415f}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 6px}
.logo{border:0;background:none;font-size:1.15rem;padding:8px 4px}
.top-r{display:flex;gap:6px}
.icon-btn{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:1.25rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:1rem;box-shadow:0 2px 0 var(--line);transition:transform .08s}
.btn:hover:not(:disabled){border-color:var(--blue)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue-d);color:#fff;box-shadow:0 3px 0 var(--blue-d)}
.btn.primary:hover:not(:disabled){background:#4d7bf5}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.danger{color:var(--red);border-color:#f1c3c1}
.btn.big-btn{min-height:62px;font-size:1.2rem;width:100%}
.btn.small-btn{min-height:42px;padding:6px 14px;font-size:.9rem;border-radius:12px}
.btn.file{cursor:pointer}
.stack{display:flex;flex-direction:column;gap:12px;margin:16px auto 6px;max-width:460px}
.actions-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
.actions-row>.big-btn,.actions-row>.win{grid-column:1/-1}
.badge{background:var(--orange);color:#fff;border-radius:99px;padding:0 9px;font-size:.85rem}
.chip{display:inline-block;background:var(--blue-l);color:var(--blue-d);font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 10px}
.sect{margin:22px 4px 8px}
.win{background:var(--amber-l);border:2px solid #f1d28a;font-weight:700}
.hero{text-align:center;margin-top:8vh}
.field{display:block;text-align:left;font-weight:700;margin:18px auto;max-width:360px}
.field input[type=text]{display:block;width:100%;margin-top:6px;padding:14px;font:inherit;border:2px solid var(--line);border-radius:14px}
.check{display:flex;gap:10px;align-items:center;margin:14px 0;font-weight:600}
.check input{width:24px;height:24px}
/* welcome */
.welcome-card{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.welcome-card h2{margin:0}.rank{font-weight:800;color:var(--blue-d);margin:4px 0}
.xp{height:12px;background:var(--blue-l);border-radius:99px;overflow:hidden;min-width:220px}
.xp i,.bar i,.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#59a5ff);border-radius:99px;transition:width .4s}
.wc-r{display:flex;gap:12px}
.stat{background:var(--bg);border-radius:14px;padding:8px 14px;text-align:center;min-width:92px}
.stat b{display:block;font-size:1.5rem}.stat span{font-size:.78rem;color:var(--muted)}
/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.skill{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 14px 12px;box-shadow:0 2px 0 var(--line)}
.skill:hover{border-color:var(--blue)}
.skill .s-num{position:absolute;top:10px;right:12px;font-weight:800;color:#a9b6d3}
.skill .s-icon{font-size:2rem;line-height:1}
.skill .s-name{font-weight:800;font-size:1.05rem;line-height:1.2}
.skill .s-stars{color:var(--gold);letter-spacing:2px}
.skill .s-state{font-size:.8rem;color:var(--muted);font-weight:700}
.skill.done{background:var(--green-l);border-color:#b6e5cb}.skill.done .s-state{color:#1c8a50}
.skill.new{border-color:var(--orange)}.skill.new .s-state{color:#d96a14}
.skill.locked{opacity:.55;background:#eef1f8}
.meter{display:block;width:100%;height:8px;background:var(--blue-l);border-radius:99px;overflow:hidden}
.meter.inline{display:inline-block;width:70px;vertical-align:middle}
.stars-big{font-size:2.6rem;color:var(--gold);letter-spacing:6px}
.stars-big.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
/* quiz */
.q-top{padding-bottom:0}.q-title{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.q-stats{display:flex;gap:12px;font-weight:800}.q-stats .hot{color:#e8590c}
.bar{height:12px;background:#dfe6f7;border-radius:99px;overflow:hidden;margin:8px 0 2px}
.qn{text-align:right}
.qcard{padding:18px}
.prompt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.prompt p{font-size:1.35rem;font-weight:800;margin:4px 0 8px}
.speak{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--blue-l);font-size:1.3rem}
.visual{display:flex;justify-content:center;margin:6px 0 14px;background:#f8faff;border:2px dashed var(--line);border-radius:16px;padding:8px}
.visual svg{width:min(100%,340px);height:auto;max-height:230px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices.n2{grid-template-columns:1fr 1fr}
.choice{display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 14px;background:#fff;border:3px solid var(--line);border-radius:16px;font-weight:800;font-size:1.15rem;text-align:left;box-shadow:0 3px 0 var(--line);transition:transform .08s,border-color .12s}
.choice:hover:not(:disabled){border-color:var(--blue);background:var(--blue-l)}
.choice .key{flex:none;width:28px;height:28px;border-radius:8px;background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;font-size:.85rem}
.choice .clabel{flex:1}
.choices.pics .choice{flex-direction:column;justify-content:center;padding:10px;position:relative}
.choices.pics .key{position:absolute;top:8px;left:8px}
.cpic svg{width:100%;max-width:150px;height:auto;max-height:130px}
.choice.wrong{background:var(--red-l);border-color:#f0b0ae;color:#8c2f2c;opacity:.75;animation:shake .35s}
.choice.right{background:var(--green-l);border-color:var(--green);box-shadow:0 0 0 3px #bdebd1}
.choice:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.coach{margin-top:16px;padding:16px 18px;border-radius:16px;border:2px solid var(--line);animation:slide .25s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(8px)}}
.coach[hidden]{display:none}
.coach .c-head{font-weight:800;font-size:1.2rem;margin-bottom:4px}
.coach.good{background:var(--green-l);border-color:#a6dfc0}
.coach.ok{background:#eaf6ff;border-color:#b5dbf5}
.coach.warn{background:var(--amber-l);border-color:#f1d28a}
.coach.bad{background:#eef2ff;border-color:#c3cff5}
.coach.neutral{background:#f2f5fb}
.coach .hint{background:#fff;border-radius:12px;padding:8px 12px}
.coach .note{color:var(--muted);font-size:.95rem}
.coach .bonus{color:#d96a14;font-weight:700;font-size:.9rem}
.coach .solved{display:flex;justify-content:center;background:#fff;border-radius:14px;margin:8px 0;padding:6px}
.coach .solved svg{width:min(100%,220px);height:auto}
.c-actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.coach .next{width:100%;margin-top:8px;min-height:58px;font-size:1.15rem}
/* results */
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.unlock{background:var(--green-l);border:2px solid #a6dfc0;border-radius:14px;padding:12px;font-weight:700;margin:10px 0}
/* lists/tables */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px}
.r-ico{font-size:1.6rem}.r-main{flex:1;display:flex;flex-direction:column}
.empty{background:var(--bg);border-radius:14px;padding:22px;text-align:center}
.table-wrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:.8rem}tr.dim{opacity:.5}
/* flashcards */
.learn{padding:6px 0}
.learn-head{display:flex;justify-content:space-between;align-items:center;margin:6px 4px}
.flip{perspective:1200px;height:380px;margin:10px 0;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:3px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;overflow:hidden}
.face.back{transform:rotateY(180deg);background:linear-gradient(180deg,#fff,var(--blue-l));border-color:var(--blue)}
.face .vis svg{width:min(100%,240px);height:auto;max-height:200px}
.face .fq{font-weight:800;font-size:1.25rem;margin-top:8px}
.face .hintline{font-size:.8rem;color:var(--muted);margin-top:8px}
.face.back h2{color:var(--blue-d);font-size:1.7rem}.face.back p{font-size:1.2rem}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav .btn{flex:1}
#overlay{position:fixed;inset:0;background:rgba(31,42,68,.55);display:grid;place-items:center;padding:14px;z-index:50;overflow:auto}
#overlay .sheet{position:relative;background:var(--bg);border-radius:24px;max-width:640px;width:100%;padding:18px;max-height:96vh;overflow:auto}
#overlay .x{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:#fff;z-index:2}
#overlay .flip{height:340px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#26334f;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){
  body{font-size:17px}
  .choices{grid-template-columns:1fr}.choices.pics{grid-template-columns:1fr 1fr}
  .actions-row{grid-template-columns:1fr}.wc-r{width:100%}.stat{flex:1}
  .flip{height:340px}.prompt p{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.btn.armed{background:var(--red-l);border-color:var(--red);color:var(--red)}

html{color-scheme:light}body{background:var(--bg);color:var(--ink)}
</style>
<div id="app"><noscript>Please turn on JavaScript to use Geometry Quest.</noscript></div>
<script>
'use strict';
/* ============================================================
   Geometry Quest - question generators, drawings and lesson cards
   Every skill has: gen(d) -> question, cards() -> flashcards
   d = difficulty 0 (easy) .. 2 (hard) inside the skill
   ============================================================ */

/* ---------- small helpers ---------- */
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const an = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
let _uid = 0; const nid = () => 'g' + (++_uid);
const rad = d => d * Math.PI / 180;
const f1 = n => (+n).toFixed(1);

const COLORS = ['#ff8a65', '#4fc3f7', '#81c784', '#ba68c8', '#ffd54f', '#f06292', '#4db6ac', '#9575cd'];
const STROKE = '#2b3a55';
const INK = '#2b3a55';
const ACCENT = '#e65100';

function mix(hex, t, to) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r + (to - r) * t); g = Math.round(g + (to - g) * t); b = Math.round(b + (to - b) * t);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
const lighten = (h, t) => mix(h, t, 255);
const darken = (h, t) => mix(h, t, 0);

/* ---------- svg helpers ---------- */
function svg(w, h, inner, vb) {
  return `<svg viewBox="${vb || `0 0 ${w} ${h}`}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
}
const P2S = pts => pts.map(p => f1(p[0]) + ',' + f1(p[1])).join(' ');
const poly = (pts, fill, extra) => `<polygon points="${P2S(pts)}" fill="${fill}" stroke="${STROKE}" stroke-width="3" stroke-linejoin="round" ${extra || ''}/>`;
const line = (x1, y1, x2, y2, o = {}) => `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${o.c || INK}" stroke-width="${o.w || 3}" stroke-linecap="round" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''}/>`;
const text = (x, y, s, o = {}) => `<text x="${f1(x)}" y="${f1(y)}" text-anchor="${o.a || 'middle'}" font-size="${o.s || 12}" font-weight="${o.b === false ? 500 : 700}" fill="${o.c || INK}" font-family="Avenir Next,Nunito,Arial,sans-serif" dominant-baseline="central">${s}</text>`;
const dot = (x, y, r = 4.5, c = INK) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="${c}"/>`;
const regPts = (n, cx, cy, r, rot = -90) => Array.from({ length: n }, (_, i) => { const a = rad(rot + i * 360 / n); return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
const centroid = pts => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
function arrowHead(x, y, deg, c = INK) { // tip at x,y pointing along deg
  const d = [Math.cos(rad(deg)), Math.sin(rad(deg))], n = [-d[1], d[0]];
  const b = [x - 11 * d[0], y - 11 * d[1]];
  return `<polygon points="${P2S([[x, y], [b[0] + 5.5 * n[0], b[1] + 5.5 * n[1]], [b[0] - 5.5 * n[0], b[1] - 5.5 * n[1]]])}" fill="${c}"/>`;
}
function rightMark(v, a, b, s = 13, c = ACCENT) { // square marker at vertex v between points a and b
  const u = unit(a[0] - v[0], a[1] - v[1]), w = unit(b[0] - v[0], b[1] - v[1]);
  const p1 = [v[0] + u[0] * s, v[1] + u[1] * s], p2 = [p1[0] + w[0] * s, p1[1] + w[1] * s], p3 = [v[0] + w[0] * s, v[1] + w[1] * s];
  return `<polyline points="${P2S([p1, p2, p3])}" fill="none" stroke="${c}" stroke-width="2.5"/>`;
}
function unit(x, y) { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }

/* ---------- question builder ---------- */
const normC = c => (typeof c === 'string' || typeof c === 'number') ? { label: String(c) } : c;
const keyOf = c => c.label !== undefined ? 'L' + c.label : 'S' + c.svg;
function mk(o) {
  const correct = normC(o.correct);
  const seen = new Set([keyOf(correct)]);
  let wrong = (o.wrong || []).map(normC).filter(w => { const k = keyOf(w); if (seen.has(k)) return false; seen.add(k); return true; });
  wrong = shuffle(wrong).slice(0, (o.n || 4) - 1);
  let items;
  if (o.pos !== undefined) { items = wrong.map(w => ({ ...w, ok: false })); items.splice(o.pos, 0, { ...correct, ok: true }); }
  else items = shuffle([{ ...correct, ok: true }, ...wrong.map(w => ({ ...w, ok: false }))]);
  return {
    prompt: o.prompt, visual: o.visual || null, choices: items, answer: items.findIndex(c => c.ok),
    hint: o.hint || 'Look closely at the picture and think about what you learned.',
    explain: o.explain || '', solved: o.solved || null, pics: items.some(c => c.svg !== undefined)
  };
}
function tf(prompt, isTrue, hint, explain, visual) {
  return mk({ prompt, visual, correct: isTrue ? 'True' : 'False', wrong: [isTrue ? 'False' : 'True'], pos: isTrue ? 0 : 1, hint, explain });
}
function nums(correct, extra = [], lo = 0) {
  const s = new Set();
  extra.forEach(x => { if (x !== correct && x >= lo && Number.isFinite(x)) s.add(x); });
  let t = 0; while (s.size < 6 && t++ < 60) { const v = correct + pick([-4, -3, -2, -1, 1, 2, 3, 4, 5, 10]); if (v >= lo && v !== correct) s.add(v); }
  return [...s];
}

/* ============================================================
   SHAPES
   ============================================================ */
const POLYS = {
  triangle: [[60, 14], [108, 98], [12, 98]],
  square: [[24, 24], [96, 24], [96, 96], [24, 96]],
  rectangle: [[10, 32], [110, 32], [110, 88], [10, 88]],
  pentagon: regPts(5, 60, 64, 48),
  hexagon: regPts(6, 60, 60, 48, 0),
  octagon: regPts(8, 60, 60, 48, -67.5),
  rhombus: [[60, 12], [106, 60], [60, 108], [14, 60]],
  trapezoid: [[36, 28], [84, 28], [110, 92], [10, 92]],
  parallelogram: [[38, 30], [112, 30], [82, 90], [8, 90]],
  kite: [[60, 10], [96, 48], [60, 112], [24, 48]]
};
const FACT = {
  circle: 'A circle is perfectly round. It has no sides and no corners.',
  oval: 'An oval is round like an egg. It has no corners.',
  square: 'A square has 4 sides that are all the same length, and 4 square corners.',
  rectangle: 'A rectangle has 4 sides and 4 square corners. It has 2 long sides and 2 short sides.',
  triangle: 'A triangle has 3 sides and 3 corners.',
  pentagon: 'A pentagon has 5 sides and 5 corners.',
  hexagon: 'A hexagon has 6 sides and 6 corners.',
  octagon: 'An octagon has 8 sides and 8 corners, like a stop sign.',
  rhombus: 'A rhombus has 4 sides that are all the same length. Its corners are slanted, so it looks like a tilted square.',
  trapezoid: 'A trapezoid has 4 sides. Its top and bottom are parallel, but the other two sides are not.',
  parallelogram: 'A parallelogram has 4 sides. Opposite sides are parallel and the same length, but the corners are slanted.',
  kite: 'A kite has 4 sides: two short sides next to each other and two long sides next to each other.'
};
const SIDES = { triangle: 3, square: 4, rectangle: 4, pentagon: 5, hexagon: 6, octagon: 8 };

function shapeInner(name, fill, pts) {
  if (name === 'circle') return `<circle cx="60" cy="60" r="42" fill="${fill}" stroke="${STROKE}" stroke-width="3"/>`;
  if (name === 'oval') return `<ellipse cx="60" cy="60" rx="50" ry="32" fill="${fill}" stroke="${STROKE}" stroke-width="3"/>`;
  return poly(pts || POLYS[name], fill);
}
function shapeSvg(name, fill, pts) { return svg(120, 120, shapeInner(name, fill || pick(COLORS), pts)); }
function shapeSvgVar(name) {
  let pts = null;
  if (name === 'rectangle') { const w = rnd(96, 108), h = rnd(40, 60); pts = [[60 - w / 2, 60 - h / 2], [60 + w / 2, 60 - h / 2], [60 + w / 2, 60 + h / 2], [60 - w / 2, 60 + h / 2]]; }
  if (name === 'triangle') pts = pick([[[60, 14], [108, 98], [12, 98]], [[20, 24], [20, 98], [104, 98]], [[30, 98], [100, 98], [78, 20]], [[60, 20], [110, 90], [24, 100]]]);
  return shapeSvg(name, null, pts);
}

}

/* ---------- flashcards ---------- */
function openLearn(id, overlay, after) {

}

/* ============================================================
   SESSIONS
   ============================================================ */
const sigOf = q => q.prompt + '|' + q.choices.find(c => c.ok).label + '|' + (q.visual ? q.visual.length : 0) + '|' + q.choices.map(c => (c.label || (c.svg || '').length)).join(',');
function newSession(mode, extra) {
  stopSpeak();
  Q = Object.assign({ mode, total: 10, idx: 0, correct: 0, points: 0, streak: 0, bestStreak: 0, d: 0, hot: 0, missed: 0, sigs: new Set(), cur: null, tries: 0, locked: false, disabled: new Set(), skillId: null, queue: null, firstMissIds: [] }, extra || {});
  nextQ();
}
function startPractice(id) {
  const r = sk(id); newSession('practice', { skillId: id, d: r.mastered || r.best >= 60 ? 1 : 0 });
}
function startMixed() {
  const pool = SKILLS.filter(s => sk(s.id).sessions > 0 || sk(s.id).mastered); if (pool.length < 1) return toast('Practice a level first!');
  newSession('mixed', { pool, d: 1 });
}
function startReview(skillId) {
  let items = S.review.filter(x => !skillId || x.skill === skillId); if (!items.length) return toast('No mistakes to review. Great job! 🎉');
  items = items.slice().sort((a, b) => a.streak - b.streak || a.t - b.t).slice(0, 10);
  newSession('review', { queue: shuffle(items), total: Math.min(10, items.length), skillId: skillId || null });
}
function startPlacement() { newSession('placement', { total: 999, d: 1, pl: { si: 0, qi: 0, right: 0 } }); }
function genFor(sid, d) { const s = skillOf(sid); for (let i = 0; i < 8; i++) { const q = s.gen(d); const g = sigOf(q); if (!Q.sigs.has(g)) { Q.sigs.add(g); q._skill = sid; return q; } } const q = s.gen(d); q._skill = sid; return q; }
function nextQ() {
  Q.tries = 0; Q.locked = false; Q.disabled = new Set();
  if (Q.mode === 'review') { const it = Q.queue[Q.idx]; Q.item = it; Q.cur = it.q; }
  else if (Q.mode === 'mixed') {
    const w = Q.pool.map(s => 1 + (1 - strength(s.id)) * 2 + S.review.filter(x => x.skill === s.id).length * .3); let r = Math.random() * w.reduce((a, b) => a + b, 0), k = 0;
    for (; k < w.length - 1; k++) { r -= w[k]; if (r <= 0) break; }
    Q.cur = genFor(Q.pool[k].id, Q.d);
  }
  else if (Q.mode === 'placement') Q.cur = genFor(SKILLS[Q.pl.si].id, 1);
  else Q.cur = genFor(Q.skillId, Q.d);
  renderQuiz();
  if (S.settings.autoRead) speak(qSpeech(Q.cur));
}
function renderQuiz() {
  const q = Q.cur, sid = q._skill || Q.skillId, s = skillOf(sid), pl = Q.mode === 'placement';
  const label = pl ? 'Finding your level' : Q.mode === 'review' ? 'Review time' : Q.mode === 'mixed' ? 'Mixed challenge' : s.name;
  const sub = Q.mode === 'review' || Q.mode === 'mixed' ? `<span class="chip">${s.icon} ${esc(s.name)}</span>` : '';
  const pct = pl ? Math.min(95, Q.idx * 6) : Math.round(Q.idx / Q.total * 100);
  view(`<header class="top q-top"><button class="icon-btn" data-act="quit" aria-label="Quit">✕</button><div class="q-title"><b>${esc(label)}</b>${sub}</div>
   <div class="q-stats">${pl ? '' : `<span id="pts">⭐ ${Q.points}</span><span id="stk" class="${Q.streak >= 3 ? 'hot' : ''}">🔥 ${Q.streak}</span>`}</div></header>
   <div class="bar" role="progressbar" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><div class="small muted qn">${pl ? `Question ${Q.idx + 1}` : `Question ${Q.idx + 1} of ${Q.total}`}</div>
   <section class="card qcard"><div class="prompt"><p>${esc(q.prompt)}</p><button class="speak" data-act="speakQ" aria-label="Read the question aloud">🔊</button></div>
   ${q.visual ? `<div class="visual">${q.visual}</div>` : ''}
   <div class="choices ${q.pics ? 'pics' : ''} n${q.choices.length}" role="group">${q.choices.map((c, i) => `<button class="choice" data-act="choose" data-i="${i}"><span class="key">${i + 1}</span>${c.svg !== undefined ? `<span class="cpic">${c.svg}</span>` : `<span class="clabel">${esc(c.label)}</span>`}</button>`).join('')}</div>
   <div id="coach" class="coach" aria-live="polite" hidden></div></section>`);
}
function markChoices(pickIdx) {
  document.querySelectorAll('.choice').forEach(b => {
    const i = +b.dataset.i;
    if (Q.disabled.has(i)) { b.classList.add('wrong'); b.disabled = true; }
    if (Q.locked) { b.disabled = true; if (Q.cur.choices[i].ok) b.classList.add('right'); }
  });
}
function coach(html, kind) {
  const c = document.getElementById('coach'); c.hidden = false; c.className = 'coach ' + kind; c.innerHTML = html;
  c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function updateStats() { const p = document.getElementById('pts'), k = document.getElementById('stk'); if (p) p.textContent = '⭐ ' + Q.points; if (k) { k.textContent = '🔥 ' + Q.streak; k.className = Q.streak >= 3 ? 'hot' : ''; } }
const praise = ['Great job!', 'Awesome!', 'Nice work!', 'You got it!', 'Super!', 'Brilliant!'];
function adapt(firstTryOk) { if (firstTryOk) { Q.hot++; if (Q.hot >= 2 && Q.d < 2) { Q.d++; Q.hot = 0; } } else { Q.hot = 0; if (Q.d > 0) Q.d--; } }
function record(sid, ok) { const r = sk(sid); r.total++; if (ok) r.correct++; r.recent.push(ok ? 1 : 0); if (r.recent.length > 20) r.recent.shift(); S.answered++; }
function addToBank(q) {
  const g = sigOf(q); if (S.review.some(x => x.sig === g)) return;
  S.review.push({ id: uidn(), sig: g, skill: q._skill, q: JSON.parse(JSON.stringify(q)), streak: 0, t: Date.now() });
  if (S.review.length > 120) S.review.shift();
}
const lessonBtn = () => `<button class="btn small-btn" data-act="lesson">📖 Show me the lesson</button>`;
function choose(i) {
  if (!Q || Q.locked || Q.disabled.has(i)) return;
  const q = Q.cur, ok = q.choices[i].ok;
  if (Q.mode === 'placement') return placementAnswer(i, ok);
  Q.tries++;
  const sid = q._skill;
  if (ok) {
    if (Q.tries === 1) {
      Q.streak++; Q.bestStreak = Math.max(Q.bestStreak, Q.streak); Q.correct++;
      const bonus = Q.streak >= 5 ? 5 : Q.streak >= 3 ? 2 : 0, pts = Q.mode === 'review' ? 5 : 10 + bonus; Q.points += pts;
      record(sid, true); adapt(true);
      if (Q.mode === 'review') { Q.item.streak++; if (Q.item.streak >= 2) { S.review = S.review.filter(x => x.id !== Q.item.id); Q.cleared = (Q.cleared || 0) + 1; } }
      Q.locked = true; markChoices(); updateStats();
      const note = Q.mode === 'review' ? (Q.item.streak >= 2 ? '🎉 Mastered! This one is cleared from your review list.' : '1 more right answer clears it from your review list.') : '';
      coach(`<div class="c-head">✅ ${pick(praise)} <b>+${pts}</b>${bonus ? ` <span class="bonus">🔥 streak bonus +${bonus}</span>` : ''}</div>${q.explain ? `<p>${esc(q.explain)}</p>` : ''}${note ? `<p class="note">${note}</p>` : ''}${nextBtn()}`, 'good');
    } else {
      Q.points += 5; Q.streak = 0; Q.locked = true; markChoices(); updateStats();
      coach(`<div class="c-head">👍 You got it on the second try! <b>+5</b></div><p>${esc(q.explain)}</p>${q.solved ? `<div class="solved">${q.solved}</div>` : ''}${nextBtn()}`, 'ok');
    }
    save(); return;
  }
  // wrong answer
  Q.disabled.add(i);
  if (Q.tries === 1) {
    Q.streak = 0; record(sid, false); adapt(false); Q.missed++;
    if (Q.mode === 'review') Q.item.streak = 0; else addToBank(q);
    updateStats(); markChoices(); save();
    const why = q.choices[i].why;
    coach(`<div class="c-head">🤔 Not quite, but good try!</div>${why ? `<p>${esc(why)}</p>` : ''}<p class="hint">💡 <b>Hint:</b> ${esc(q.hint)}</p><p class="note">Pick another answer. You can try once more!</p><div class="c-actions"><button class="btn small-btn" data-act="speakHint">🔊 Read hint</button>${lessonBtn()}</div>`, 'warn');
  } else {
    Q.locked = true; markChoices();
    const right = q.choices[q.answer];
    coach(`<div class="c-head">📘 Let's learn from this one</div><p>The correct answer is <b>${right.label !== undefined ? esc(right.label) : 'the highlighted picture'}</b>.</p><p>${esc(q.explain)}</p>${q.solved ? `<div class="solved">${q.solved}</div>` : ''}<p class="note">We saved this question in <b>Review</b> so you can try it again later.</p><div class="c-actions"><button class="btn small-btn" data-act="speakExplain">🔊 Read it to me</button>${lessonBtn()}</div>${nextBtn()}`, 'bad');
  }
  save();
}
const nextBtn = () => `<button class="btn primary next" data-act="next">${Q.idx + 1 >= Q.total ? 'See my results 🎉' : 'Next ▶'}</button>`;
function next() { if (!Q || !Q.locked) return; Q.idx++; stopSpeak(); if (Q.idx >= Q.total) finishSession(); else nextQ(); }

/* ---------- placement ---------- */
function placementAnswer(i, ok) {
  Q.locked = true; markChoices(); const mine = Q;
  const c = document.getElementById('coach'); c.hidden = false; c.className = 'coach ' + (ok ? 'good' : 'neutral'); c.innerHTML = ok ? '<div class="c-head">✅ Got it!</div>' : '<div class="c-head">👍 Thanks! On to the next one.</div>';
  if (ok) Q.pl.right++; Q.idx++;
  setTimeout(() => {
    if (Q !== mine) return; const pl = Q.pl; pl.qi++;
    if (pl.qi === 2) {
      if (pl.right === 2) { const r = sk(SKILLS[pl.si].id); r.mastered = true; r.placed = true; r.stars = Math.max(r.stars, 2); r.best = Math.max(r.best, 100); pl.si++; pl.qi = 0; pl.right = 0; if (pl.si >= SKILLS.length) return placementDone(); }
      else return placementDone();
    }
    nextQ();
  }, ok ? 800 : 1200);
}
function placementDone() {
  S.placed = true; save(); Q = null;
  const start = SKILLS.findIndex((s, i) => !sk(s.id).mastered); const placedOut = SKILLS.filter(s => sk(s.id).placed && sk(s.id).sessions === 0).length;
  view(`${topbar()}<section class="card center"><div class="big">🎯</div><h2>All set, ${esc(S.name)}!</h2>
  ${start >= 0 ? `<p class="lead">${placedOut ? `You already know ${placedOut} level${placedOut > 1 ? 's' : ''}. Awesome!` : 'Everyone starts somewhere. Let\'s build your skills!'}<br>You will start at <b>Level ${start + 1}: ${esc(SKILLS[start].name)}</b>.</p>` : `<p class="lead">Wow! You already know everything here. Try a Mixed Challenge!</p>`}
  <button class="btn primary big-btn" data-act="home">Show my levels</button></section>`);
}

/* ---------- finish ---------- */
function finishSession() {
  const mode = Q.mode, acc = Q.total ? Q.correct / Q.total : 0, pct = Math.round(acc * 100), st = acc >= .95 ? 3 : acc >= .8 ? 2 : acc >= .6 ? 1 : 0;
  let unlocked = null, passed = false, bonus = 0;
  if (mode === 'practice') {
    const r = sk(Q.skillId); r.sessions++; r.best = Math.max(r.best, pct); r.stars = Math.max(r.stars, st);
    passed = acc >= .8; bonus = st * 20;
    if (passed && !r.mastered) { r.mastered = true; const i = idxOf(Q.skillId); if (SKILLS[i + 1]) unlocked = SKILLS[i + 1]; bonus += 50; }
  }
  if (mode === 'mixed') bonus = st * 10;
  S.xp += Q.points + bonus; save();
  const i = Q.skillId ? idxOf(Q.skillId) : -1, nextS = i >= 0 ? SKILLS[i + 1] : null, canNext = nextS && isUnlocked(i + 1);
  const msg = mode === 'review' ? (Q.cleared ? `You cleared ${Q.cleared} question${Q.cleared > 1 ? 's' : ''} from your review list!` : 'Keep practicing. 2 right answers in a row clears a question.')
    : passed ? 'You mastered this level! 🎉' : acc >= .6 ? 'Good progress! A little more practice and you will master it.' : 'This one is tricky. Try the flashcards, then practice again. You can do it!';
  let h = `${topbar()}<section class="card center results"><h2>${mode === 'review' ? 'Review complete!' : mode === 'mixed' ? 'Challenge complete!' : 'Level complete!'}</h2>
   ${mode !== 'review' ? `<div class="stars-big pop">${stars(st)}</div>` : '<div class="big">🔁</div>'}
   <div class="res-grid"><div class="stat"><b>${Q.correct}/${Q.total}</b><span>right on the first try</span></div><div class="stat"><b>${pct}%</b><span>score</span></div><div class="stat"><b>+${Q.points + bonus}</b><span>⭐ points</span></div><div class="stat"><b>${Q.bestStreak}</b><span>🔥 best streak</span></div></div>
   <p class="lead">${msg}</p>${bonus ? `<p class="small muted">Includes +${bonus} bonus points${unlocked ? ' for mastering the level' : ''}.</p>` : ''}
   ${unlocked ? `<div class="unlock">🔓 New level unlocked: <b>${unlocked.icon} ${esc(unlocked.name)}</b></div>` : ''}
   ${Q.missed && mode !== 'review' ? `<p class="small">You missed ${Q.missed} question${Q.missed > 1 ? 's' : ''}. They are saved in <b>Review</b>.</p>` : ''}
   <div class="stack">`;
  if (mode === 'practice') {
    if (passed && canNext) h += `<button class="btn primary big-btn" data-act="learn" data-id="${nextS.id}">Next level: ${esc(nextS.name)} ➜</button>`;
    else if (!passed) h += `<button class="btn primary big-btn" data-act="learn" data-id="${Q.skillId}">📖 Study the flashcards</button>`;
    h += `<button class="btn ${passed && canNext ? '' : 'primary'}" data-act="practice" data-id="${Q.skillId}">🎯 Practice again</button>`;
  }
  if (mode === 'mixed') h += `<button class="btn primary big-btn" data-act="mixed">🎲 Another challenge</button>`;
  if (mode === 'review' && S.review.length) h += `<button class="btn primary big-btn" data-act="reviewHub">🔁 More review (${S.review.length} left)</button>`;
  if (S.review.length && mode !== 'review') h += `<button class="btn" data-act="reviewHub">🔁 Review mistakes (${S.review.length})</button>`;
  h += `<button class="btn ghost" data-act="home">🏠 Back to levels</button></div></section>`;
  Q = null; view(h);
}

/* ---------- review / progress / settings ---------- */

  h += `</tbody></table></div><p class="small muted">"Recent strength" is the share of the last 20 questions in each level answered correctly on the first try. Review the levels with low strength.</p><button class="btn ghost" data-act="home">← Back</button></section>`;

/* ============================================================
   EVENTS
   ============================================================ */
function twice(b, msg) {
  if (b.dataset.armed) return true;
  const old = b.textContent; b.dataset.armed = '1'; b.textContent = msg; b.classList.add('armed');
  setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; b.classList.remove('armed'); } }, 4000); return false;
}
const ACT = {
  home, progress, settings, reviewHub,
  saveName() { const v = document.getElementById('nm').value.trim(); if (!v) return toast('Please type your name first.'); S.name = v; save(); S.placed ? home() : placeIntro(); },
  startPlacement, skipPlacement() { S.placed = true; save(); home(); },
  continue() { const i = SKILLS.findIndex((s, k) => isUnlocked(k) && !sk(s.id).mastered); if (i < 0) return; const id = SKILLS[i].id; sk(id).sessions ? startPractice(id) : openLearn(id, false, 'practice'); },
  skill(e, b) { skillMenu(b.dataset.id); }, locked() { toast('🔒 Master the level before it (8 out of 10) to unlock this one.'); },
  learn(e, b) { openLearn(b.dataset.id, false); },
  practice(e, b) { startPractice(b.dataset.id); }, mixed: startMixed, reviewAll() { startReview(); }, reviewSkill(e, b) { startReview(b.dataset.id); },
  flip() { L.flipped = !L.flipped; const f = document.querySelector('.flip'); if (f) f.classList.toggle('flipped', L.flipped); },
  lnext() { L.i++; L.flipped = false; renderLearn(); }, lprev() { L.i--; L.flipped = false; renderLearn(); },
  lspeak() { const c = L.cards[L.i]; speak(L.flipped ? c.t + '. ' + c.d : (c.q || 'What is this?')); },
  lclose() { const o = document.getElementById('overlay'); if (o) o.remove(); stopSpeak(); L = null; },
  lpractice() { const id = L.id; L = null; startPractice(id); }, lexit() { const id = L.id; L = null; skillMenu(id); },
  lesson() { openLearn(Q.cur._skill || Q.skillId, true); },
  quit() { stopSpeak(); Q = null; home(); },
  speakQ() { speak(qSpeech(Q.cur)); }, speakHint() { speak('Hint. ' + Q.cur.hint); }, speakExplain() { speak(Q.cur.explain); },
  choose(e, b) { choose(+b.dataset.i); }, next,
  saveSettings() { const v = document.getElementById('nm').value.trim(); if (v) S.name = v; S.settings.autoRead = document.getElementById('autoRead').checked; S.settings.unlockAll = document.getElementById('unlockAll').checked; save(); toast('Saved ✓'); home(); },
  redoPlacement(e, b) { if (!twice(b, 'Tap again to redo the quiz')) return; placeIntro(); },
  export(e, b) {
    const code = JSON.stringify(S), t = document.getElementById('impTxt');
    const fallback = () => { t.value = code; t.select(); toast('Select all and copy the code above.'); };
    try { navigator.clipboard.writeText(code).then(() => toast('Backup code copied ✓'), fallback); } catch (er) { fallback(); }
  },
  import() { try { const d = JSON.parse(document.getElementById('impTxt').value.trim()); if (!d || d.v !== 1 || !d.skills) throw 0; S = Object.assign(defaults(), d); save(); toast('Progress restored ✓'); home(); } catch (er) { toast('That is not a valid backup code.'); } },
  reset(e, b) { if (!twice(b, 'Tap again to erase everything')) return; const nm = S.name; S = defaults(); S.name = nm; save(); welcome(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.closest('#overlay') && !['lclose', 'flip', 'lnext', 'lprev', 'lspeak'].includes(b.dataset.act)) return;
  const f = ACT[b.dataset.act]; if (f) f(e, b);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) { if (e.key === 'Enter' && document.getElementById('nm') && ACT.saveName && document.querySelector('[data-act="saveName"]')) ACT.saveName(); return; }
  if (e.target.matches('.flip') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ACT.flip(); return; }
  if (!Q || document.getElementById('overlay')) return;
  if (/^[1-4]$/.test(e.key) && Q.cur && +e.key <= Q.cur.choices.length) choose(+e.key - 1);
  else if ((e.key === 'Enter' || e.key === ' ') && Q.locked && Q.mode !== 'placement') { e.preventDefault(); next(); }
});
/* ---------- boot ---------- */
load();
if (!S.name) welcome(); else if (!S.placed) placeIntro(); else home();
if ('speechSynthesis' in window) speechSynthesis.getVoices();

</script>

</body></html>
